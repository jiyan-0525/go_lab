# Azure DevOps CI/CD Pipeline for Go Lab Monorepo
# Builds and pushes multi-stage Docker images to Docker Hub

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - services/go_server/**
      - services/htmx_demo/**

pool:
  vmImage: ubuntu-latest

steps:
# -------------------------------------------------------------
# Task 1: Build & Push `go_server` -> jiyanwang/goserver
# -------------------------------------------------------------
- task: Docker@2
  displayName: "Build and Push: goserver"
  inputs:
    containerRegistry: 'dockerhub-conn'
    repository: 'jiyanwang/goserver'
    command: 'buildAndPush'
    dockerfile: 'services/go_server/Dockerfile'
    buildContext: 'services/go_server'
    tags: |
      latest
      $(Build.BuildId)

# -------------------------------------------------------------
# Task 2: Build & Push `htmx_demo` -> jiyanwang/htmx-dashboard
# -------------------------------------------------------------
- task: Docker@2
  displayName: "Build and Push: htmx-dashboard"
  inputs:
    containerRegistry: 'dockerhub-conn'
    repository: 'jiyanwang/htmx-dashboard'
    command: 'buildAndPush'
    dockerfile: 'services/htmx_demo/Dockerfile'
    buildContext: 'services/htmx_demo'
    tags: |
      latest
      $(Build.BuildId)
